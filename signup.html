<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TalaTrade - Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo"><span>★</span> TalaTrade</div>
</header>

<main>
  <div class="form-card">
    <h2>Sign up</h2>
    <input type="text" placeholder="Full Name" />
    <input type="password" placeholder="Password" />
    <input type="text" placeholder="Shipping Address" />
    <input type="text" placeholder="Contact Number" />
    <input type="text" placeholder="Role (1 = Admin; 2 = Customer)" />
    <button class="btn">Create An Account</button>
    <a href="index.html" class="link">Already Have an Account?</a>
  </div>
</main>
</body>
</html>
